<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intellismart Group Blog | AI Readiness & Automation</title>
  <meta name="description" content="Practical guidance from Intellismart Group on AI readiness, automation, and putting AI to work in your business.">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #F5F4EB;
      --cream: #ECEADD;
      --border: #D5D2C4;
      --text-primary: #333334;
      --text-secondary: #555555;
      --text-muted: #888888;
      --gold: #C5A047;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--cream), var(--white));
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 50px;
      background: rgba(236,234,221,.96);
      border-bottom: 1px solid rgba(213,210,196,.7);
      backdrop-filter: blur(8px);
    }
    .logo {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 24px;
      color: var(--text-primary);
      text-decoration: none;
    }
    .back {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .back:hover { color: var(--gold); }
    main { padding: 110px 24px 130px; }
    .header {
      max-width: 760px;
      margin: 0 auto 64px;
      text-align: center;
    }
    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(48px, 8vw, 86px);
      font-weight: 400;
      letter-spacing: -.03em;
      line-height: 1.03;
      margin-bottom: 24px;
    }
    .header p {
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1.7;
    }
    .blog-embed {
      max-width: 1100px;
      min-height: 300px;
      margin: 0 auto;
    }
    footer {
      padding: 32px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .nav { padding: 18px 24px; }
      main { padding-top: 80px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="/">Intellismart Group</a>
    <a class="back" href="/">← Back to Home</a>
  </nav>

  <main>
    <header class="header">
      <div class="label">Insights</div>
      <h1>From the Blog</h1>
      <p>Practical guidance on AI readiness, automation, and putting AI to work in your business.</p>
    </header>

    <section class="blog-embed" aria-label="Intellismart Group blog articles">
      <div id="soro-blog"></div>
      <script src="https://app.trysoro.com/api/embed/df2257b4-1ed5-4927-95b0-ca75a68f9e04" defer></script>
    </section>
  </main>

  <footer>© Intellismart Group</footer>
</body>
</html>
