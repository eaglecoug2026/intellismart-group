name: Publish new Soro blog articles

# Soro writes a new article every couple of days. This copies any new ones
# into the blog pages + sitemap, commits them to main, and rebuilds GitHub
# Pages so they go live. A failed run emails the repo owner.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-soro-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy articles from Soro
        run: |
          before=$(find blog -mindepth 1 -maxdepth 1 -type d | wc -l)
          node scripts/generate-soro-blog.mjs
          after=$(find blog -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Articles on site: $before -> $after"
          if [ "$after" -lt "$before" ]; then
            echo "::error::Soro returned fewer articles ($after) than the site already has ($before). Not publishing."
            exit 1
          fi

      - name: Commit new articles
        id: commit
        run: |
          git add -A blog blog.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No new articles."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish new Soro blog articles"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
